name: payments-app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-payments}
      POSTGRES_USER: ${DB_USER:-payments}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payments}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  meridian-mock:
    build: ./meridian-mock
    # Lets the mock reach an API running on your machine (host.docker.internal works on
    # Docker Desktop already; this line makes it work on Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "9090"
      MERIDIAN_API_KEY: ${MERIDIAN_API_KEY:-mock-api-key}
      MERIDIAN_WEBHOOK_SECRET: ${MERIDIAN_WEBHOOK_SECRET:-local-dev-webhook-secret}
      MOCK_ALLOWED_ORIGIN: ${MOCK_ALLOWED_ORIGIN:-http://localhost:3000}
      MOCK_SETTLE_AFTER_SECONDS: ${MOCK_SETTLE_AFTER_SECONDS:-30}
      MOCK_AUTH_DELAY_MS: ${MOCK_AUTH_DELAY_MS:-10000}
      MOCK_DUPLICATE_WEBHOOKS: ${MOCK_DUPLICATE_WEBHOOKS:-false}
      MOCK_OUT_OF_ORDER: ${MOCK_OUT_OF_ORDER:-false}
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost can resolve to ::1, and the mock listens on IPv4 only
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  payments-api:
    build: ./payments-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-payments}
      DB_USER: ${DB_USER:-payments}
      DB_PASSWORD: ${DB_PASSWORD:-payments}
      # Server-to-server address of Meridian (the mock inside compose).
      MERIDIAN_BASE_URL: ${MERIDIAN_BASE_URL:-http://meridian-mock:9090}
      MERIDIAN_API_KEY: ${MERIDIAN_API_KEY:-mock-api-key}
      MERIDIAN_WEBHOOK_SECRET: ${MERIDIAN_WEBHOOK_SECRET:-local-dev-webhook-secret}
      CALLBACK_URL: ${CALLBACK_URL:-http://payments-api:8080/webhooks/meridian}
      SUPPORTED_CURRENCIES: ${SUPPORTED_CURRENCIES:-GBP,EUR,USD,CAD,AUD,CHF,SEK,NOK,DKK,PLN}
      MAX_PAYMENT_AMOUNT: ${MAX_PAYMENT_AMOUNT:-10000.00}
      # The browser origin allowed to call /api/** (the UI).
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  payment-ui:
    build: ./payment-ui
    environment:
      # Read at container start (written to /config.json) and used by the user's
      # browser, so these are host-visible URLs, not compose-internal names.
      PAYMENTS_API_URL: ${PAYMENTS_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
